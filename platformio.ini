; ESP32-C3 SuperMini. It has no board file of its own; the C3 DevKitM-1 is
; the same chip and flash size. The two USB flags match the Arduino IDE's
; "USB CDC On Boot: Enabled" so Serial goes out the USB-C port.

[platformio]
src_dir = firmware/SolarEyes

[env:supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
